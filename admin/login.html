<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPT Admin Login</title>
<meta name="robots" content="noindex">
<script src="../site/demo-api.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--p1:#16161a;--line:#34343c;--tx:#f4f4f6;--mu:#b8b8c2;--ac:#f2611d}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg) radial-gradient(circle at 1px 1px,#1f1f24 1px,transparent 0) 0 0/22px 22px;color:var(--tx);font:17px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.box{width:min(440px,100%);background:var(--p1);border:1px solid var(--line);border-radius:20px;padding:40px 36px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.brand{font:400 40px Anton;letter-spacing:.02em}
.brand span{color:var(--ac);font-style:italic}
.brand em{font:600 14px Inter;font-style:normal;color:var(--mu);text-transform:uppercase;letter-spacing:.14em;margin-left:6px}
p.sub{color:var(--mu);margin:8px 0 28px}
label{display:block;font-weight:600;font-size:16px;margin:18px 0 8px}
input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:15px 16px;color:var(--tx);font:17px Inter}
input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px rgba(242,97,29,.2)}
.pw{position:relative}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mu);font:600 14px Inter;cursor:pointer;padding:8px}
button.go{width:100%;margin-top:28px;background:var(--ac);color:#111;border:0;border-radius:12px;padding:16px;font:700 17px Inter;cursor:pointer}
button.go:hover{filter:brightness(1.1)}
button.go:disabled{opacity:.6;cursor:wait}
.err{margin-top:16px;background:#2a1414;border:1px solid #5b2323;color:#fca5a5;border-radius:10px;padding:12px 14px;font-size:15px}
.back{display:block;margin-top:22px;text-align:center;color:var(--mu);font-size:15px;text-decoration:none}
.back:hover{color:var(--tx)}
[hidden]{display:none!important}
</style>
</head>
<body>
<form class="box" id="f" novalidate>
  <div class="brand"><span>//</span>MPT <em>Admin</em></div>
  <p class="sub">Melde dich an, um die Website zu bearbeiten.</p>
  <label for="u">Benutzername</label>
  <input id="u" name="user" autocomplete="username" required autofocus>
  <label for="p">Passwort</label>
  <div class="pw"><input id="p" name="pass" type="password" autocomplete="current-password" required><button type="button" id="show" aria-label="Passwort anzeigen">Zeigen</button></div>
  <button class="go" type="submit">Anmelden →</button>
  <div class="err" id="err" role="alert" hidden></div>
  <a class="back" href="../">← Zur Website</a>
</form>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), p = document.getElementById('p');
document.getElementById('show').onclick = e => { const s = p.type === 'password'; p.type = s ? 'text' : 'password'; e.target.textContent = s ? 'Verbergen' : 'Zeigen'; };
f.addEventListener('submit', async e => {
  e.preventDefault(); err.hidden = true;
  const btn = f.querySelector('.go'); btn.disabled = true;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: f.user.value.trim(), pass: f.pass.value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Anmeldung fehlgeschlagen');
    location.href = './';
  } catch (x) { err.textContent = x.message.includes('fetch') ? 'Server nicht erreichbar. Läuft „python3 server.py"?' : x.message; err.hidden = false; p.select(); }
  finally { btn.disabled = false; }
});
</script>
</body>
</html>
